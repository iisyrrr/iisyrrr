# Copie ce fichier en config.yaml puis remplis-le.
# config.yaml contient tes mots de passe : il n'est JAMAIS envoyé sur GitHub (.gitignore).

# alert_only = le robot envoie les signaux sur Telegram mais ne passe AUCUN ordre
# live       = le robot passe réellement les ordres
mode: alert_only

strategy: ema_cross_rsi_atr   # remplacée par ta stratégie dès que tu me la décris

mt5:
  login: 12345678
  password: "MOT_DE_PASSE"
  server: "NomDuBroker-Demo"
  path: ""                    # optionnel : C:\Program Files\MetaTrader 5\terminal64.exe

telegram:
  token: "123456789:AAxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"   # donné par @BotFather
  chat_id: "123456789"                                  # ton identifiant (voir README)

trading:
  symbols: [EURUSD, GBPUSD, XAUUSD]  # noms EXACTS chez ton broker (ex : EURUSD.r, XAUUSDm…)
  timeframe: M15                     # M1 M5 M15 M30 H1 H4 D1
  history_bars: 1000                 # bougies utilisées pour calculer les indicateurs
  magic: 20261005                    # identifiant des ordres du robot
  deviation_points: 20               # slippage max accepté
  max_spread_points: 30              # pas d'entrée si le spread est plus large
  spread_spike_factor: 2.5           # ni s'il dépasse 2,5 x sa valeur habituelle (news surprise)
  poll_seconds: 10

risk:
  risk_per_trade_pct: 0.5     # % de l'équité risqué par trade (perte si SL touché)
  max_open_positions: 3
  max_daily_loss_pct: 3.0     # au-delà : plus de nouvelles positions jusqu'au lendemain
  adaptive:                   # réduit le risque automatiquement en cas de mauvaise série
    enabled: true
    lookback_trades: 20
    min_profit_factor: 1.0
    reduced_multiplier: 0.5

optimizer:                    # auto-amélioration
  enabled: true
  every_days: 7               # fréquence de réoptimisation
  history_bars: 20000         # historique utilisé (augmente "Max bars in chart" dans MT5 si besoin)
  trials: 80
  local_steps: 30
  in_sample_ratio: 0.7        # 70 % pour chercher, 30 % récents pour valider
  min_trades_oos: 30          # trades minimum sur la période de validation
  min_profit_factor_oos: 1.15
  improvement_margin: 0.10    # doit faire au moins 10 % mieux pour être adopté

# ============================================================================
# VEILLE NEWS : calendrier économique, médias, banques centrales, réseaux sociaux
# ============================================================================
news:
  enabled: true
  contact: ""                   # ton e-mail : demandé par certains sites officiels (BLS) pour les robots
  poll_minutes: 5               # fréquence de collecte (FinancialJuice : chaque minute)
  timezone: "Europe/Paris"      # heure affichée dans les alertes et le briefing
  morning_brief_time: "07:30"   # briefing du matin sur Telegram ("" = désactivé)
  brief_weekends: false
  max_alerts_per_hour: 6        # anti-spam
  event_reminder_minutes: 15    # rappel avant chaque annonce à fort impact (0 = off)

  # Que faire si un signal va CONTRE le sentiment des news ?
  #   off   = ignorer   | warn = trader mais le signaler dans l'alerte
  #   block = ne pas trader
  #   auto  = le robot décide seul : il passe en "block" s'il constate sur ses propres
  #           trades (au moins auto_min_trades) que ceux pris contre les news perdent
  sentiment_filter: warn
  sentiment_threshold: 0.5      # sentiment de -1 à +1 ; |sentiment| >= 0.5 = clair
  auto_min_trades: 30
  auto_lookback_days: 90        # le mode auto juge sur les 90 derniers jours (il peut changer d'avis)

  # Pas de nouvelle position autour des annonces à fort impact sur les devises du symbole
  blackout:
    enabled: true
    impacts: [High]
    minutes_before: 30
    minutes_after: 30
    major_minutes_before: 45    # NFP, CPI, décisions de banques centrales…
    major_minutes_after: 60     # conférences de presse : couvertes jusqu'à 30 min après la fin
    breaking_minutes: 15        # après une info urgente confirmée par une source de premier plan
    fail_closed: true           # calendrier indisponible/périmé = AUCUNE nouvelle entrée (recommandé)

  # Filtrage par IA (Claude) : pertinence, impact, crédibilité, rumeur ou fait,
  # effet probable sur chaque devise, résumé en français, briefing du matin.
  # Sans clé, le robot utilise seulement le filtre automatique (moins fin).
  ai:
    enabled: true
    api_key: ""                 # clé sur console.anthropic.com (ou variable ANTHROPIC_API_KEY)
    model: claude-opus-5-5
    effort: low                 # classement des news : low suffit et coûte moins
    brief_effort: medium        # briefing du matin
    max_items_per_cycle: 25

  # 34 sources par défaut sont activées automatiquement (voir README). Une source
  # n'est interrogée utilement que si tu trades un actif qu'elle concerne.
  # Pour en AJOUTER sans les remplacer :
  extra_sources: []
  #  - type: x                  # API X, payante à la lecture (~45-75 $/mois pour 10-15 comptes)
  #    bearer_token: ""
  #    accounts: [federalreserve, ecb, bankofengland, USTreasury, BLS_gov, DeItaone, FirstSquawk,
  #               LiveSquawk, NickTimiraos, Reuters, WSJmarkets, CNBCnow, KitcoNewsNOW]
  #    official_accounts: [federalreserve, ecb, bankofengland, USTreasury, BLS_gov]
  #  - type: bluesky            # comptes vérifiés par nom de domaine, gratuits
  #    accounts:
  #      - {handle: reuters.com, name: Reuters, tier: 1, group: Reuters}
  #      - {handle: federalreserve.gov, name: Fed, tier: 1, kind: official, group: Fed}
  #  - type: reddit             # DÉCONSEILLÉ : création d'applis fermée, accès public coupé (mars 2027)
  #    subreddits: [economics]
  #    client_id: ""
  #    client_secret: ""
  #  - type: finnhub            # clé gratuite sur finnhub.io
  #    api_key: ""
  #  - type: rss                # n'importe quel flux RSS
  #    name: "Mon flux"
  #    url: "https://exemple.com/feed"
  #    tier: 2                  # 1 = officiel/agence majeure, 2 = média spécialisé, 3 = social
  # Pour REMPLACER complètement la liste par défaut, utilise "sources:" à la place.

  # Si le nom d'un symbole n'est pas reconnu (ex : un indice exotique), indique ses actifs :
  symbol_assets: {}
